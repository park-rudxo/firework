name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DATABASE_URL: postgresql://firework:firework@localhost:5432/firework
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest

    # 구독·알림 동의·권한은 규칙이 여러 테이블에 걸쳐 있어서 함수를 흉내내는 것으로는
    # "구독을 끊으면 동의도 지워지는가" 를 확인할 수 없다. tests/db 는 진짜 Postgres 에
    # 대고 검증하므로 단위 테스트 잡에도 DB 가 필요하다.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: firework
          POSTGRES_PASSWORD: firework
          POSTGRES_DB: firework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      # Next 16 은 next build 에서 lint 를 돌리지 않으므로 여기서 따로 돌린다.
      - name: 린트
        run: npm run lint

      - name: 스키마 적용
        run: npx prisma migrate deploy

      - name: 단위 테스트
        run: npm test

      - name: 빌드
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: firework
          POSTGRES_PASSWORD: firework
          POSTGRES_DB: firework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 스키마 적용과 시드
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: E2E
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
